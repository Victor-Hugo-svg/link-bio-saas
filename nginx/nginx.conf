events {}
http {
    server {
        listen 80;

        location /pages/ {
            proxy_pass http://pages-service:8000;
        }
        location /leads {
            proxy_pass http://pages-service:8000;
        }
        location /track/ {
            proxy_pass http://analytics-service:8001;
        }
        location /stats {
            proxy_pass http://analytics-service:8001;
        }
    }
}