apiVersion: apps/v1
kind: Deployment
metadata:
  name: pages-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pages-service
  template:
    metadata:
      labels:
        app: pages-service
    spec:
      containers:
      - name: pages-service
        image: linkbio-pages:1.0
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "100m"
          limits:
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: pages-service
spec:
  type: NodePort
  selector:
    app: pages-service
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30001